<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030">
  <title>Admin attendance view: Sage Mist, light only</title>
  <desc>Original nonfunctional layout preview with verified historical KPI and SMS-group counts. Trend geometry and assistant output are illustrative. Four drafted function tools read versioned Azure Blob data through a local backend. No dark mode or theme toggle.</desc>
  <style>
    text { font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; fill: #000; letter-spacing: -.025em; }
    .muted { fill: #495940; }
    .small { font-size: 12px; }
    .body { font-size: 14px; }
    .label { font-size: 11px; font-weight: 650; letter-spacing: .8px; }
    .title { font-size: 19px; font-weight: 650; }
    .card { fill: #fdfdfd; stroke: #e7e7ee; }
    .control { fill: #fdfdfd; stroke: #495940; }
    .primary { fill: #afbea5; }
    .soft { fill: #e4eae1; }
  </style>
  <rect width="1440" height="1030" rx="22.4" fill="#fdfdfd"/>
  <path d="M0 78H1440" stroke="#e7e7ee"/>
  <rect x="24" y="22" width="34" height="34" rx="12" class="primary"/>
  <path d="M35 39h12M41 33v12" stroke="#000" stroke-width="3"/>
  <text x="72" y="36" font-size="16" font-weight="650">Demo Medical Center</text>
  <text x="72" y="55" class="small muted">Attendance insights / educational demo</text>
  <rect x="969" y="17" width="209" height="44" rx="20" fill="#edf0f4"/>
  <text x="994" y="45" class="small">Patient</text>
  <rect x="1072" y="21" width="102" height="36" rx="18" class="primary"/>
  <text x="1102" y="45" class="small" font-weight="650">Admin</text>
  <text x="1195" y="44" class="small muted">Read-only demo</text>
  <text x="1311" y="44" class="small muted">Demo details</text>

  <rect x="16" y="112" width="168" height="866" rx="22.4" fill="#f5f8fb"/>
  <text x="32" y="148" class="label muted">WORKSPACE</text>
  <rect x="28" y="168" width="143" height="44" rx="18.4" class="soft"/>
  <text x="42" y="195" class="body muted">Attendance</text>
  <text x="42" y="252" class="body muted">About this data</text>
  <text x="42" y="301" class="body muted">Agent evidence</text>
  <text x="32" y="876" class="small muted">Source of truth</text>
  <text x="32" y="902" class="body" font-weight="650">Azure Blob</text>
  <text x="32" y="927" class="small muted">Planned private containers</text>
  <text x="32" y="953" class="small muted">No login required in UI</text>

  <text x="216" y="134" font-size="28" font-weight="650">Understand missed appointments</text>
  <text x="216" y="162" class="body muted">Historical patterns, not predictions about individual patients.</text>
  <rect x="216" y="180" width="840" height="32" rx="13" class="soft"/>
  <text x="229" y="201" class="small">Kaggle / Brazil / 29 Apr - 8 Jun 2016 / Planned source: versioned Azure Blob snapshot</text>
  <rect x="216" y="224" width="267" height="44" rx="18.4" class="control"/>
  <text x="230" y="251" class="small">Appointment dates: full study period</text>
  <rect x="495" y="224" width="230" height="44" rx="18.4" class="control"/>
  <text x="509" y="251" class="small">Facility neighborhood: all</text>
  <rect x="737" y="224" width="194" height="44" rx="18.4" class="control"/>
  <text x="751" y="251" class="small">Recorded SMS flag: all</text>
  <text x="969" y="251" class="small muted">Reset filters</text>

  <rect x="216" y="284" width="198" height="106" rx="22.4" class="card"/>
  <rect x="430" y="284" width="198" height="106" rx="22.4" class="card"/>
  <rect x="644" y="284" width="198" height="106" rx="22.4" class="card"/>
  <rect x="858" y="284" width="198" height="106" rx="22.4" class="card"/>
  <text x="234" y="312" class="small muted">Appointment records</text>
  <text x="234" y="351" font-size="30" font-weight="650">110,527</text>
  <text x="234" y="373" class="small muted">Not unique patients</text>
  <text x="448" y="312" class="small muted">Attended</text>
  <text x="448" y="351" font-size="30" font-weight="650">88,208</text>
  <text x="448" y="373" class="small muted">Recorded outcome</text>
  <text x="662" y="312" class="small muted">No-shows</text>
  <text x="662" y="351" font-size="30" font-weight="650">22,319</text>
  <text x="662" y="373" class="small muted">Recorded outcome</text>
  <text x="876" y="312" class="small muted">No-show rate</text>
  <text x="876" y="351" font-size="30" font-weight="650">20.2%</text>
  <text x="876" y="373" class="small muted">22,319 / 110,527</text>

  <rect x="216" y="410" width="516" height="290" rx="22.4" class="card"/>
  <text x="236" y="443" class="title">No-show rate over time</text>
  <text x="236" y="466" class="small muted">Daily appointment-date cohorts / show n in tooltips</text>
  <path d="M245 502H702M245 547H702M245 592H702" stroke="#e7e7ee"/>
  <path d="M245 590L295 553L345 571L395 526L445 551L495 512L545 535L595 510L645 545L698 520" fill="none" stroke="#495940" stroke-width="4"/>
  <path d="M245 590L295 553L345 571L395 526L445 551L495 512L545 535L595 510L645 545L698 520" fill="none" stroke="#afbea5" stroke-width="2"/>
  <rect x="342" y="535" width="267" height="33" rx="13" fill="#f5f5f5"/>
  <text x="358" y="556" class="small muted">Illustrative shape / not computed series</text>
  <text x="245" y="620" class="small muted">29 Apr 2016</text>
  <text x="630" y="620" class="small muted">8 Jun 2016</text>
  <text x="236" y="672" class="body muted">Ask the agent about this chart  &gt;</text>

  <rect x="750" y="410" width="306" height="290" rx="22.4" class="card"/>
  <text x="770" y="443" class="title">Attendance breakdown</text>
  <circle cx="903" cy="534" r="53" fill="none" stroke="#495940" stroke-width="20"/>
  <circle cx="903" cy="534" r="53" fill="none" stroke="#fd822b" stroke-width="17"/>
  <circle cx="903" cy="534" r="53" fill="none" stroke="#4ac885" stroke-width="17" stroke-dasharray="265.76 333.01" transform="rotate(-90 903 534)"/>
  <text x="866" y="535" font-size="23" font-weight="650">20.2%</text>
  <text x="877" y="555" class="small muted">no-show</text>
  <rect x="770" y="613" width="9" height="9" rx="2" fill="#4ac885" stroke="#495940"/>
  <text x="791" y="622" class="small">Attended</text>
  <text x="974" y="622" class="small">88,208</text>
  <rect x="770" y="639" width="9" height="9" rx="2" fill="#fd822b" stroke="#495940"/>
  <text x="791" y="648" class="small">No-show</text>
  <text x="974" y="648" class="small">22,319</text>
  <text x="770" y="680" class="small muted">Two outcomes only / source counts</text>

  <rect x="216" y="720" width="516" height="258" rx="22.4" class="card"/>
  <text x="236" y="753" class="title">Recorded SMS flag and attendance</text>
  <text x="236" y="778" class="small muted">An observed association, not a reminder experiment.</text>
  <text x="236" y="817" class="small muted">Source flag</text>
  <text x="443" y="817" class="small muted">Appointments</text>
  <text x="626" y="817" class="small muted">No-show</text>
  <path d="M236 830H710" stroke="#e7e7ee"/>
  <text x="236" y="854" class="body">0 / not recorded</text>
  <text x="465" y="854" class="body">75,045</text>
  <text x="646" y="854" class="body">16.7%</text>
  <text x="236" y="889" class="body">1 / recorded</text>
  <text x="465" y="889" class="body">35,482</text>
  <text x="646" y="889" class="body">27.6%</text>
  <text x="236" y="931" class="small muted">Do not conclude that SMS causes more missed visits.</text>
  <text x="236" y="954" class="small muted">Ask about the limitations  &gt;</text>
  <rect x="750" y="720" width="306" height="258" rx="22.4" class="card"/>
  <text x="770" y="753" class="title">Data and definitions</text>
  <text x="770" y="790" class="body">81 facility neighborhoods</text>
  <text x="770" y="823" class="body">5 negative scheduling intervals</text>
  <text x="770" y="847" class="small muted">Excluded only from lead-time analyses</text>
  <text x="770" y="886" class="body">No-show = Yes in the source</text>
  <text x="770" y="909" class="small muted">No cancellations or future bookings</text>
  <text x="770" y="948" class="small muted">Open source and methodology  &gt;</text>

  <rect x="1080" y="112" width="336" height="866" rx="22.4" class="card"/>
  <text x="1100" y="146" class="title">Attendance analyst</text>
  <text x="1100" y="171" class="small muted">Foundry agent / read-only</text>
  <rect x="1096" y="195" width="304" height="67" rx="16" class="soft"/>
  <text x="1110" y="218" class="small">Scope: full study period</text>
  <text x="1110" y="241" class="small muted">Chart: attendance breakdown</text>
  <text x="1100" y="302" class="label muted">ILLUSTRATIVE RESPONSE</text>
  <text x="1100" y="331" class="body">22,319 of 110,527 appointment</text>
  <text x="1100" y="355" class="body">records were marked as no-show.</text>
  <text x="1100" y="389" class="body">That is 20.2% of this cohort.</text>
  <text x="1100" y="423" class="body">This does not tell us why any</text>
  <text x="1100" y="447" class="body">individual missed an appointment.</text>
  <rect x="1100" y="469" width="228" height="29" rx="13" class="soft"/>
  <text x="1112" y="488" class="small muted">Evidence: attendance summary</text>
  <path d="M1100 526H1396" stroke="#e7e7ee"/>
  <text x="1100" y="558" class="body" font-weight="650">How this answer is supported</text>
  <text x="1100" y="590" class="small muted">Proposed tool: get_attendance_summary</text>
  <text x="1100" y="615" class="small muted">Source: attendance-data / Blob snapshot</text>
  <text x="1100" y="640" class="small muted">Version, ETag and cohort returned by tool</text>
  <text x="1100" y="674" class="small muted">Preview only / no live tool call shown</text>
  <rect x="1096" y="713" width="304" height="44" rx="18.4" class="soft"/>
  <text x="1110" y="740" class="small muted">Compare the recorded SMS groups</text>
  <rect x="1096" y="769" width="304" height="44" rx="18.4" class="soft"/>
  <text x="1110" y="796" class="small muted">Explain the scheduling-gap exclusions</text>
  <rect x="1096" y="864" width="304" height="54" rx="18.4" class="control"/>
  <text x="1110" y="895" class="body muted">Ask about the selected cohort...</text>
  <text x="1100" y="950" class="small muted">Numeric tools and sources / not risk scoring</text>
  <text x="24" y="1010" class="small muted">SAGE MIST / LIGHT ONLY   Original preview. Counts are source-derived; trend and agent output are illustrative. Blob resource is planned.</text>
</svg>
