<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="930" viewBox="0 0 1360 930">
  <title>Patient view: Sage Mist, light only</title>
  <desc>Original nonfunctional layout preview using inspected Sage Mist colors. A fictional appointment and visit guide sit beside a contextual assistant. Example patient details and response are not real records or a live agent run. Intended font is Plus Jakarta Sans with a local fallback.</desc>
  <style>
    text { font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; fill: #000; letter-spacing: -.025em; }
    .muted { fill: #495940; }
    .small { font-size: 13px; }
    .body { font-size: 15px; }
    .label { font-size: 12px; font-weight: 650; letter-spacing: .8px; }
    .title { font-size: 22px; font-weight: 650; }
    .card { fill: #fdfdfd; stroke: #e7e7ee; }
    .control { fill: #fdfdfd; stroke: #495940; }
    .primary { fill: #afbea5; }
    .soft { fill: #e4eae1; }
  </style>
  <rect width="1360" height="930" rx="22.4" fill="#fdfdfd"/>
  <path d="M0 84H1360" stroke="#e7e7ee"/>
  <rect x="32" y="24" width="36" height="36" rx="12" class="primary"/>
  <path d="M43 42h14M50 35v14" stroke="#000" stroke-width="3"/>
  <text x="82" y="40" font-size="17" font-weight="650">Demo Medical Center</text>
  <text x="82" y="59" class="small muted">Appointment support / educational demo</text>
  <rect x="860" y="20" width="232" height="44" rx="20" fill="#edf0f4"/>
  <rect x="864" y="24" width="110" height="36" rx="18" class="primary"/>
  <text x="895" y="48" class="small" font-weight="650">Patient</text>
  <text x="1005" y="48" class="small">Admin</text>
  <text x="1110" y="48" class="small muted">Read-only demo</text>
  <text x="1231" y="48" class="small muted">Demo details</text>
  <rect x="32" y="106" width="1296" height="36" rx="13" class="soft"/>
  <text x="48" y="129" class="small">Fictional patient and appointment. No real care, messages, or booking actions. This screen is a design preview.</text>
  <text x="40" y="188" font-size="30" font-weight="650">Hello, Alex.</text>
  <text x="40" y="217" font-size="16" class="muted">Everything you need to understand your next visit.</text>

  <rect x="40" y="250" width="816" height="246" rx="22.4" class="card"/>
  <text x="64" y="281" class="label muted">YOUR NEXT VISIT</text>
  <rect x="703" y="266" width="128" height="27" rx="13" class="soft"/>
  <text x="716" y="284" class="small muted">Example booking</text>
  <text x="64" y="322" class="title">Tuesday, 15 September 2026</text>
  <text x="64" y="357" font-size="30" font-weight="650">09:30</text>
  <text x="164" y="353" class="body muted">Demo local time / fictional appointment</text>
  <text x="64" y="390" class="body">General visit / Demo Medical Center</text>
  <text x="64" y="416" class="body muted">Main entrance / Example location, not a real address</text>
  <rect x="64" y="437" width="204" height="44" rx="18.4" class="primary"/>
  <text x="87" y="464" class="body" font-weight="600">Ask about this visit</text>
  <rect x="282" y="437" width="156" height="44" rx="18.4" class="control"/>
  <text x="307" y="464" class="body">Read visit guide</text>

  <rect x="40" y="520" width="396" height="226" rx="22.4" class="card"/>
  <text x="64" y="555" font-size="19" font-weight="650">Before you arrive</text>
  <text x="64" y="590" class="body">- Check the example visit details.</text>
  <text x="64" y="620" class="body">- Bring your appointment information.</text>
  <text x="64" y="650" class="body">- Write down questions for the visit.</text>
  <text x="64" y="696" class="small muted">Source: fictional center visit guide</text>
  <text x="64" y="723" class="small muted">Read-only guidance, not a task tracker</text>
  <rect x="456" y="520" width="400" height="226" rx="22.4" class="card"/>
  <text x="480" y="555" font-size="19" font-weight="650">Need help attending?</text>
  <text x="480" y="589" class="body muted">Find the center's access and language</text>
  <text x="480" y="613" class="body muted">support information before your visit.</text>
  <rect x="480" y="635" width="238" height="44" rx="18.4" fill="#edf0f4"/>
  <text x="494" y="662" class="small muted">Ask about accessibility support</text>
  <text x="480" y="710" class="small muted">No diagnosis or personal risk score.</text>
  <text x="480" y="730" class="small muted">No reminder, confirm, or cancel action.</text>

  <rect x="880" y="250" width="448" height="586" rx="22.4" class="card"/>
  <rect x="901" y="271" width="32" height="32" rx="12" class="soft"/>
  <text x="909" y="294" font-size="19" class="muted">*</text>
  <text x="947" y="291" font-size="19" font-weight="650">Visit assistant</text>
  <text x="903" y="327" class="small muted">Uses the Blob-backed fictional visit and guides</text>
  <path d="M900 346H1306" stroke="#e7e7ee"/>
  <rect x="992" y="367" width="309" height="56" rx="18.4" class="primary"/>
  <text x="1008" y="400" class="body">What should I bring to this visit?</text>
  <text x="903" y="454" class="label muted">ILLUSTRATIVE RESPONSE / NOT A LIVE RUN</text>
  <text x="903" y="487" class="body">Bring your appointment information and</text>
  <text x="903" y="512" class="body">the questions you want to discuss.</text>
  <text x="903" y="548" class="body">The example visit guide is linked below.</text>
  <rect x="903" y="570" width="176" height="28" rx="12" class="soft"/>
  <text x="916" y="589" class="small muted">1  Fictional visit guide</text>
  <text x="903" y="626" class="small muted">Show sources and tools used  &gt;</text>
  <rect x="903" y="649" width="402" height="65" rx="16" fill="#f5f5f5"/>
  <text x="918" y="673" class="small muted">Proposed tool: get_demo_visit_brief</text>
  <text x="918" y="698" class="small muted">Source: demo-assets / synthetic fixture</text>
  <rect x="903" y="735" width="402" height="51" rx="18.4" class="control"/>
  <text x="918" y="766" class="body muted">Ask about this visit...</text>
  <rect x="1250" y="738" width="44" height="44" rx="17" class="primary"/>
  <path d="M1265 760h13m-6-6 6 6-6 6" fill="none" stroke="#000" stroke-width="2"/>
  <text x="903" y="816" class="small muted">Foundry prompt agent / read-only tools</text>
  <text x="40" y="788" class="small muted">No individual Kaggle patient records, historical cohort rates, or no-show risk labels appear here.</text>
  <text x="40" y="816" class="small muted">The appointment, location, and sample response are fictional design content.</text>
  <path d="M32 860H1328" stroke="#e7e7ee"/>
  <text x="40" y="891" class="small muted">SAGE MIST / LIGHT ONLY   Selected 21st.dev theme colors. Original layout preview. No theme-switch control.</text>
</svg>
